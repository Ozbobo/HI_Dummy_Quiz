<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#ffffff" />
<title>Compare Home Insurance Rates</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #222;
    background: #ffffff;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Header ---------- */
  .site-header {
    background: #fff;
    padding: 18px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #f0f0f0;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
  }
  .logo svg { width: 36px; height: 36px; flex-shrink: 0; }
  .logo-text {
    font-size: 26px;
    font-weight: 800;
    color: #111;
    letter-spacing: -0.3px;
  }
  .logo-text .accent { color: #2196F3; }

  .phone {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #2196F3;
    font-weight: 700;
    font-size: 18px;
    text-decoration: none;
    white-space: nowrap;
  }
  .phone svg { width: 22px; height: 22px; }

  /* ---------- Progress section ---------- */
  .progress-section {
    background: #f5f5f5;
    padding: 18px 24px 22px;
    border-bottom: 1px solid #ececec;
  }
  .progress-inner {
    max-width: 900px;
    margin: 0 auto;
  }
  .progress-title {
    text-align: center;
    font-size: 18px;
    font-weight: 600;
    color: #333;
    margin: 0 0 12px;
  }
  .progress-bar {
    width: 100%;
    height: 26px;
    background: #e6e6e6;
    border-radius: 4px;
    overflow: hidden;
    position: relative;
  }
  .progress-fill {
    height: 100%;
    background: #22C55E;
    border-radius: 4px;
    transition: width 0.4s cubic-bezier(.4,0,.2,1);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 13px;
    font-weight: 700;
    min-width: 90px;
    white-space: nowrap;
  }

  /* ---------- Main content ---------- */
  .main {
    flex: 1;
    padding: 40px 24px 60px;
  }
  .main-inner {
    max-width: 900px;
    margin: 0 auto;
  }
  .question-title {
    text-align: center;
    font-size: 32px;
    font-weight: 400;
    color: #222;
    line-height: 1.25;
    margin: 0 0 36px;
  }
  .question-title strong {
    font-weight: 800;
    color: #111;
  }

  .field {
    display: block;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    padding: 16px 18px;
    font-size: 18px;
    border: 2px solid #ddd;
    border-radius: 6px;
    background: #fff;
    color: #111;
    text-align: center;
    transition: border-color 0.2s;
    -webkit-appearance: none;
    appearance: none;
  }
  .field:focus {
    outline: none;
    border-color: #2196F3;
  }

  .options {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    max-width: 720px;
    margin: 0 auto;
  }
  .options.single { grid-template-columns: 1fr; max-width: 480px; }
  .options.three { grid-template-columns: repeat(3, 1fr); max-width: 720px; }
  .options.five { grid-template-columns: repeat(5, 1fr); max-width: 720px; }

  .option-btn {
    width: 100%;
    padding: 22px 16px;
    font-size: 18px;
    font-weight: 700;
    color: #fff;
    background: #2196F3;
    border: 2px solid #2196F3;
    border-radius: 6px;
    cursor: pointer;
    text-align: center;
    transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
    -webkit-tap-highlight-color: transparent;
    line-height: 1.2;
  }
  .option-btn:hover { background: #1E88E5; border-color: #1E88E5; }
  .option-btn:active { transform: scale(0.98); }
  .option-btn.selected {
    background: #1565C0;
    border-color: #1565C0;
    box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.25);
  }

  .actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 32px;
  }
  .btn {
    padding: 14px 32px;
    font-size: 16px;
    font-weight: 700;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s, opacity 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary {
    background: #2196F3;
    color: white;
    min-width: 200px;
  }
  .btn-primary:hover { background: #1E88E5; }
  .btn-primary:disabled {
    background: #BDBDBD;
    cursor: not-allowed;
  }
  .btn-ghost {
    background: transparent;
    color: #666;
    border: 2px solid #ddd;
  }
  .btn-ghost:hover { border-color: #999; color: #333; }

  /* ---------- Loading ---------- */
  .loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 60px 0 40px;
  }
  .spinner {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 6px solid #E3F2FD;
    border-top-color: #2196F3;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-msg {
    font-size: 18px;
    color: #444;
    font-weight: 600;
    text-align: center;
    min-height: 24px;
    transition: opacity 0.3s;
  }

  /* ---------- Result ---------- */
  .result {
    text-align: center;
    max-width: 600px;
    margin: 0 auto;
    animation: fadeIn 0.5s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .result-emoji {
    font-size: 56px;
    margin-bottom: 8px;
    animation: bounce 1.4s ease-in-out infinite;
    display: inline-block;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .result h1 {
    font-size: 32px;
    font-weight: 800;
    color: #111;
    margin: 0 0 8px;
  }
  .result-sub {
    color: #555;
    font-size: 17px;
    margin: 0 0 24px;
  }
  .price-card {
    background: #2196F3;
    color: white;
    border-radius: 10px;
    padding: 28px 20px;
    margin: 0 auto 24px;
    box-shadow: 0 8px 24px -8px rgba(33, 150, 243, 0.5);
  }
  .price-label {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    opacity: 0.9;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .price-amount {
    font-size: 56px;
    font-weight: 800;
    letter-spacing: -1.5px;
    line-height: 1;
  }
  .price-period {
    font-size: 16px;
    opacity: 0.95;
    margin-top: 4px;
  }
  .features {
    text-align: left;
    background: #f8f9fa;
    border-radius: 8px;
    padding: 18px 22px;
    margin-bottom: 24px;
    border: 1px solid #ececec;
  }
  .feature {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 0;
    font-size: 15px;
    color: #333;
  }
  .feature .check { color: #22C55E; font-weight: 800; }

  /* ---------- Footer ---------- */
  .carriers {
    border-top: 1px solid #ececec;
    padding: 28px 24px 24px;
    text-align: center;
    background: #fff;
  }
  .carriers-title {
    font-weight: 700;
    font-size: 16px;
    color: #333;
    margin: 0 0 18px;
  }
  .carrier-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 28px 36px;
    max-width: 900px;
    margin: 0 auto;
  }
  .carrier {
    color: #555;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0.2px;
    opacity: 0.85;
  }
  .carrier.usaa { color: #003359; font-weight: 800; }
  .carrier.liberty { color: #0F1F4A; font-style: italic; font-weight: 700; }
  .carrier.nationwide { color: #00609F; font-weight: 800; }
  .carrier.lemonade { color: #ED1A6E; font-style: italic; font-family: Georgia, serif; }
  .carrier.hippo { color: #1FB89F; font-weight: 800; }

  .site-footer {
    padding: 22px 24px 28px;
    text-align: center;
    background: #fff;
    border-top: 1px solid #ececec;
  }
  .footer-links {
    color: #2196F3;
    font-size: 13px;
    margin-bottom: 8px;
    line-height: 1.8;
  }
  .footer-links a {
    color: #2196F3;
    text-decoration: underline;
    margin: 0 4px;
  }
  .footer-links .sep { color: #aaa; margin: 0 6px; }
  .footer-address {
    color: #666;
    font-size: 13px;
  }

  /* ---------- Confetti ---------- */
  #confetti {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 50;
  }

  .screen { animation: fadeIn 0.35s ease; }

  /* ---------- Mobile ---------- */
  @media (max-width: 640px) {
    .site-header { padding: 14px 16px; }
    .logo svg { width: 30px; height: 30px; }
    .logo-text { font-size: 20px; }
    .phone { font-size: 15px; }
    .phone svg { width: 18px; height: 18px; }

    .progress-section { padding: 14px 16px 18px; }
    .progress-title { font-size: 15px; margin-bottom: 10px; }
    .progress-bar { height: 22px; }
    .progress-fill { font-size: 11px; min-width: 70px; }

    .main { padding: 28px 16px 40px; }
    .question-title { font-size: 22px; margin-bottom: 24px; }

    .options { grid-template-columns: 1fr; gap: 12px; }
    .options.three, .options.five { grid-template-columns: repeat(3, 1fr); }
    .option-btn { padding: 18px 12px; font-size: 16px; }
    .options.three .option-btn,
    .options.five .option-btn { padding: 16px 8px; font-size: 16px; }

    .btn-primary { min-width: 0; flex: 1; }
    .actions { flex-direction: row; }

    .result h1 { font-size: 26px; }
    .price-amount { font-size: 44px; }

    .carrier-row { gap: 18px 24px; }
    .carrier { font-size: 15px; }

    .footer-links { font-size: 12px; }
    .footer-address { font-size: 12px; }
  }
</style>
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <a href="#" class="logo" aria-label="Home">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 11.5L12 4l9 7.5V20a1 1 0 01-1 1h-5v-6h-6v6H4a1 1 0 01-1-1v-8.5z"
              fill="#2196F3" stroke="#1565C0" stroke-width="0.8" stroke-linejoin="round"/>
      </svg>
      <span class="logo-text">Home Insurance <span class="accent">Rates</span></span>
    </a>
    <a href="tel:8555783601" class="phone">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M22 16.92V20a2 2 0 01-2.18 2 19.86 19.86 0 01-8.63-3.07 19.5 19.5 0 01-6-6A19.86 19.86 0 012.12 4.18 2 2 0 014.11 2h3.08a2 2 0 012 1.72c.13.96.36 1.91.7 2.81a2 2 0 01-.45 2.11L8.09 10a16 16 0 006 6l1.36-1.35a2 2 0 012.11-.45c.9.34 1.85.57 2.81.7a2 2 0 011.72 2.02z"
              stroke="#2196F3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>855-578-3601</span>
    </a>
  </header>

  <!-- Progress -->
  <section class="progress-section">
    <div class="progress-inner">
      <h2 class="progress-title">Compare Home Insurance Rates</h2>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width:20%">20% Complete</div>
      </div>
    </div>
  </section>

  <!-- Main -->
  <main class="main">
    <div class="main-inner" id="card">
      <!-- Screens render here -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="footer-links">
      <a href="#">Privacy Policy</a><span class="sep">|</span>
      <a href="#">Terms of Use</a><span class="sep">|</span>
      <a href="#">Do not sell my personal information</a><span class="sep">|</span>
      <a href="#">Contact us</a><span class="sep">|</span>
      <a href="#">About us</a><span class="sep">|</span>
      <a href="#">California Privacy Choices</a><span class="sep">|</span>
      <a href="#">Cookies and Other Technology</a>
    </div>
  </footer>

  <canvas id="confetti"></canvas>

<script>
(() => {
  const TOTAL_QUESTIONS = 5;
  const state = { step: 0, answers: {} };

  const questions = [
    {
      key: 'zip',
      title: ["Let's get started!", "What's your ZIP code?"],
      type: 'input',
      inputType: 'tel',
      placeholder: '12345',
      maxLength: 5,
      validate: v => /^\d{5}$/.test(v),
    },
    {
      key: 'homeType',
      title: ["Tell us about it.", "Select Type of Property"],
      type: 'options',
      layout: 'three',
      autoAdvance: true,
      options: [
        { value: 'house', label: 'House' },
        { value: 'condo', label: 'Condo' },
        { value: 'apartment', label: 'Apartment' },
      ],
    },
    {
      key: 'yearBuilt',
      title: ["Almost halfway.", "When was your home built?"],
      type: 'input',
      inputType: 'tel',
      placeholder: 'e.g. 1998',
      maxLength: 4,
      validate: v => /^\d{4}$/.test(v) && +v >= 1800 && +v <= new Date().getFullYear(),
    },
    {
      key: 'sqft',
      title: ["Just a couple more.", "What is the home's square footage?"],
      type: 'input',
      inputType: 'tel',
      placeholder: 'e.g. 1800',
      maxLength: 6,
      validate: v => /^\d{2,6}$/.test(v) && +v >= 100,
    },
    {
      key: 'bedrooms',
      title: ["Last one!", "How many bedrooms?"],
      type: 'options',
      layout: 'five',
      autoAdvance: true,
      options: [
        { value: '1', label: '1' },
        { value: '2', label: '2' },
        { value: '3', label: '3' },
        { value: '4', label: '4' },
        { value: '5+', label: '5+' },
      ],
    },
  ];

  const card = document.getElementById('card');
  const progressFill = document.getElementById('progressFill');

  function setProgress(step) {
    const pct = Math.round(((step) / TOTAL_QUESTIONS) * 100);
    const display = step >= TOTAL_QUESTIONS ? 100 : Math.max(pct, 5);
    progressFill.style.width = display + '%';
    progressFill.textContent = (step >= TOTAL_QUESTIONS ? 100 : pct) + '% Complete';
  }

  function render() {
    if (state.step >= TOTAL_QUESTIONS) {
      setProgress(TOTAL_QUESTIONS);
      return renderLoading();
    }
    setProgress(state.step);

    const q = questions[state.step];
    const answer = state.answers[q.key] || '';
    const [intro, main] = q.title;

    let body = '';
    if (q.type === 'input') {
      body = `
        <input
          class="field"
          id="answer"
          type="${q.inputType || 'text'}"
          inputmode="${q.inputType === 'tel' ? 'numeric' : 'text'}"
          placeholder="${q.placeholder || ''}"
          maxlength="${q.maxLength || 50}"
          value="${escapeHtml(answer)}"
          autocomplete="off"
        />`;
    } else {
      const layoutClass = q.layout || 'single';
      body = `<div class="options ${layoutClass}">${q.options.map(o => `
        <button class="option-btn ${answer === o.value ? 'selected' : ''}" data-value="${o.value}">
          ${o.label}
        </button>`).join('')}</div>`;
    }

    const showActions = q.type === 'input' || !q.autoAdvance;
    const actions = showActions ? `
      <div class="actions">
        ${state.step > 0 ? `<button class="btn btn-ghost" id="back">Back</button>` : ''}
        <button class="btn btn-primary" id="next" ${canAdvance(q, answer) ? '' : 'disabled'}>
          ${state.step === TOTAL_QUESTIONS - 1 ? 'See My Rate' : 'Continue'}
        </button>
      </div>` : (state.step > 0 ? `
      <div class="actions">
        <button class="btn btn-ghost" id="back">Back</button>
      </div>` : '');

    card.innerHTML = `
      <div class="screen">
        <h1 class="question-title">${escapeHtml(intro)} <strong>${escapeHtml(main)}</strong></h1>
        ${body}
        ${actions}
      </div>`;

    bindEvents(q);
  }

  function canAdvance(q, value) {
    if (!value) return false;
    if (q.validate) return q.validate(value);
    return true;
  }

  function bindEvents(q) {
    const nextBtn = document.getElementById('next');
    const backBtn = document.getElementById('back');
    if (backBtn) backBtn.onclick = () => { state.step--; render(); };

    if (q.type === 'input') {
      const input = document.getElementById('answer');
      input.addEventListener('input', e => {
        state.answers[q.key] = e.target.value;
        if (nextBtn) nextBtn.disabled = !canAdvance(q, e.target.value);
      });
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter' && nextBtn && !nextBtn.disabled) advance();
      });
      if (window.matchMedia('(hover: hover)').matches) input.focus();
    } else {
      card.querySelectorAll('.option-btn').forEach(btn => {
        btn.onclick = () => {
          state.answers[q.key] = btn.dataset.value;
          card.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          if (nextBtn) nextBtn.disabled = false;
          if (q.autoAdvance) setTimeout(advance, 250);
        };
      });
    }

    if (nextBtn) nextBtn.onclick = advance;
  }

  function advance() {
    const q = questions[state.step];
    const v = state.answers[q.key];
    if (!canAdvance(q, v)) return;
    state.step++;
    render();
  }

  function renderLoading() {
    const messages = [
      'Checking your area...',
      'Comparing rates from top carriers...',
      'Almost done...',
    ];
    card.innerHTML = `
      <div class="screen loading">
        <div class="spinner"></div>
        <div class="loading-msg" id="loadingMsg">${messages[0]}</div>
      </div>`;
    const el = document.getElementById('loadingMsg');
    let i = 0;
    const interval = setInterval(() => {
      i++;
      if (i >= messages.length) return;
      el.style.opacity = '0';
      setTimeout(() => {
        el.textContent = messages[i];
        el.style.opacity = '1';
      }, 250);
    }, 850);

    setTimeout(() => {
      clearInterval(interval);
      renderResult();
    }, 2600);
  }

  function renderResult() {
    card.innerHTML = `
      <div class="screen result">
        <div class="result-emoji">🎉</div>
        <h1>You're pre-approved!</h1>
        <p class="result-sub">Based on your answers, here's your estimated rate:</p>
        <div class="price-card">
          <div class="price-label">Annual Premium</div>
          <div class="price-amount">$781.99</div>
          <div class="price-period">per year</div>
        </div>
        <div class="features">
          <div class="feature"><span class="check">✓</span> Dwelling coverage up to $300,000</div>
          <div class="feature"><span class="check">✓</span> Personal property protection</div>
          <div class="feature"><span class="check">✓</span> Liability coverage included</div>
          <div class="feature"><span class="check">✓</span> 24/7 claims support</div>
        </div>
        <div class="actions">
          <button class="btn btn-primary" id="continueBtn">Continue</button>
        </div>
      </div>`;

    document.getElementById('continueBtn').onclick = fireConfetti;
    fireConfetti();
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // Confetti
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  function sizeCanvas() {
    canvas.width = window.innerWidth * devicePixelRatio;
    canvas.height = window.innerHeight * devicePixelRatio;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }
  sizeCanvas();
  window.addEventListener('resize', sizeCanvas);

  const colors = ['#2196F3', '#1E88E5', '#22C55E', '#FFC107', '#1565C0', '#ffffff'];
  let particles = [];
  let animating = false;

  function fireConfetti() {
    const W = window.innerWidth;
    const H = window.innerHeight;
    const count = 140;
    for (let i = 0; i < count; i++) {
      particles.push({
        x: W / 2 + (Math.random() - 0.5) * 60,
        y: H / 3,
        vx: (Math.random() - 0.5) * 14,
        vy: (Math.random() * -12) - 4,
        g: 0.32 + Math.random() * 0.15,
        size: 6 + Math.random() * 6,
        color: colors[Math.floor(Math.random() * colors.length)],
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 0.3,
        life: 0,
        maxLife: 120 + Math.random() * 60,
      });
    }
    if (!animating) {
      animating = true;
      requestAnimationFrame(tick);
    }
  }

  function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles = particles.filter(p => {
      p.vy += p.g;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      p.life++;
      const alpha = Math.max(0, 1 - p.life / p.maxLife);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
      ctx.restore();
      return p.life < p.maxLife && p.y < window.innerHeight + 40;
    });
    if (particles.length > 0) {
      requestAnimationFrame(tick);
    } else {
      animating = false;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }

  render();
})();
