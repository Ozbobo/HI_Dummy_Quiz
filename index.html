<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#ffffff" />
<title>Compare Home Insurance Rates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #15254a;
    --navy-soft: #1f3263;
    --teal: #2db0a8;
    --teal-dark: #228e87;
    --green: #22c55e;
    --grey-50: #fafafa;
    --grey-100: #f3f4f6;
    --grey-200: #e8e9ec;
    --grey-300: #d6d9de;
    --grey-500: #6b7280;
    --grey-700: #374151;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--navy);
    background: #fff;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Header ---------- */
  .site-header {
    padding: 24px 32px 18px;
    display: grid;
    grid-template-columns: 1fr 2fr 1fr;
    align-items: center;
    gap: 24px;
    max-width: 1280px;
    margin: 0 auto;
    width: 100%;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: var(--navy);
  }
  .logo svg { width: 34px; height: 34px; flex-shrink: 0; }
  .logo-text {
    line-height: 1;
    font-weight: 800;
    color: var(--navy);
  }
  .logo-text .top {
    display: block;
    font-size: 22px;
    letter-spacing: 0.5px;
  }
  .logo-text .bottom {
    display: block;
    font-size: 11px;
    letter-spacing: 4px;
    margin-top: 4px;
    font-weight: 700;
  }

  .header-progress {
    position: relative;
    padding: 18px 0 0;
  }
  .header-progress-track {
    width: 100%;
    height: 4px;
    background: var(--grey-200);
    border-radius: 999px;
    overflow: visible;
    position: relative;
  }
  .header-progress-fill {
    height: 100%;
    background: var(--green);
    border-radius: 999px;
    transition: width 0.45s cubic-bezier(.4,0,.2,1);
    position: relative;
  }
  .header-progress-bubble {
    position: absolute;
    top: -32px;
    transform: translateX(-50%);
    background: #111;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 14px;
    transition: left 0.45s cubic-bezier(.4,0,.2,1);
    white-space: nowrap;
  }
  .header-progress-bubble::after {
    content: "";
    position: absolute;
    bottom: -5px;
    left: 50%;
    transform: translateX(-50%);
    border-left: 5px solid transparent;
    border-right: 5px solid transparent;
    border-top: 6px solid #111;
  }

  .phone {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    color: var(--teal);
    font-weight: 600;
    font-size: 17px;
    text-decoration: none;
    white-space: nowrap;
  }
  .phone svg { width: 22px; height: 22px; }

  /* ---------- Main ---------- */
  .main {
    flex: 1;
    padding: 28px 24px 40px;
  }
  .main-inner {
    max-width: 900px;
    margin: 0 auto;
    text-align: center;
  }
  .pretitle {
    font-size: 16px;
    color: var(--navy);
    font-weight: 500;
    margin: 0 0 6px;
  }
  .pretitle strong { font-weight: 700; }

  .question-title {
    font-family: "Playfair Display", Georgia, "Times New Roman", serif;
    font-size: 44px;
    font-weight: 800;
    color: var(--navy);
    line-height: 1.15;
    letter-spacing: -0.5px;
    margin: 0 0 36px;
  }

  /* Inputs */
  .field {
    display: block;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    padding: 18px 20px;
    font-size: 18px;
    border: 1.5px solid var(--grey-300);
    border-radius: 8px;
    background: #fff;
    color: var(--navy);
    text-align: center;
    transition: border-color 0.2s, box-shadow 0.2s;
    -webkit-appearance: none;
    appearance: none;
    font-family: inherit;
  }
  .field::placeholder { color: var(--grey-500); }
  .field:focus {
    outline: none;
    border-color: var(--teal);
    box-shadow: 0 0 0 3px rgba(45, 176, 168, 0.15);
  }

  /* Option buttons */
  .options {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    max-width: 720px;
    margin: 0 auto;
  }
  .options.three { grid-template-columns: repeat(3, 1fr); max-width: 720px; }
  .options.five { grid-template-columns: repeat(5, 1fr); max-width: 720px; }

  .option-btn {
    width: 100%;
    padding: 22px 16px;
    font-size: 16px;
    font-weight: 700;
    color: var(--navy);
    background: var(--grey-100);
    border: 1.5px solid transparent;
    border-radius: 8px;
    cursor: pointer;
    text-align: center;
    transition: background 0.15s, border-color 0.15s, transform 0.1s, box-shadow 0.15s;
    -webkit-tap-highlight-color: transparent;
    line-height: 1.2;
    font-family: inherit;
    letter-spacing: 0.2px;
  }
  .option-btn:hover {
    background: var(--grey-200);
    border-color: var(--grey-300);
  }
  .option-btn:active { transform: scale(0.98); }
  .option-btn.selected {
    background: var(--navy);
    color: #fff;
    border-color: var(--navy);
    box-shadow: 0 6px 16px -6px rgba(21, 37, 74, 0.4);
  }

  /* Action buttons */
  .actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 32px;
  }
  .btn {
    padding: 14px 32px;
    font-size: 16px;
    font-weight: 700;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s, opacity 0.2s;
    -webkit-tap-highlight-color: transparent;
    font-family: inherit;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary {
    background: var(--teal);
    color: white;
    min-width: 200px;
  }
  .btn-primary:hover { background: var(--teal-dark); }
  .btn-primary:disabled {
    background: var(--grey-300);
    color: #fff;
    cursor: not-allowed;
  }
  .btn-ghost {
    background: transparent;
    color: var(--grey-700);
    border: 1.5px solid var(--grey-300);
  }
  .btn-ghost:hover { border-color: var(--navy); color: var(--navy); }

  /* ---------- Call expert widget ---------- */
  .call-expert {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin: 56px auto 0;
    padding: 0 16px;
    color: var(--navy);
    font-size: 14px;
    font-weight: 600;
  }
  .call-expert .avatar {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: linear-gradient(135deg, #b9e6e3 0%, #e0f2f1 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--teal-dark);
    flex-shrink: 0;
  }
  .call-expert .avatar svg { width: 28px; height: 28px; }
  .call-expert .label { color: var(--navy); }
  .call-expert .phone-link {
    color: var(--teal);
    font-weight: 700;
    text-decoration: underline;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .call-expert .phone-link svg { width: 16px; height: 16px; }

  /* ---------- Loading ---------- */
  .loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 60px 0 40px;
  }
  .spinner {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 6px solid #e6f5f4;
    border-top-color: var(--teal);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-msg {
    font-size: 18px;
    color: var(--navy);
    font-weight: 600;
    text-align: center;
    min-height: 24px;
    transition: opacity 0.3s;
  }

  /* ---------- Result ---------- */
  .result {
    text-align: center;
    max-width: 600px;
    margin: 0 auto;
    animation: fadeIn 0.5s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .result-emoji {
    font-size: 56px;
    margin-bottom: 6px;
    display: inline-block;
    animation: bounce 1.4s ease-in-out infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .result h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-size: 38px;
    font-weight: 800;
    color: var(--navy);
    margin: 0 0 8px;
  }
  .result-sub {
    color: var(--grey-700);
    font-size: 16px;
    margin: 0 0 22px;
  }
  .price-card {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-soft) 100%);
    color: white;
    border-radius: 12px;
    padding: 28px 20px;
    margin: 0 auto 22px;
    box-shadow: 0 12px 32px -10px rgba(21, 37, 74, 0.4);
    border: 1px solid rgba(45, 176, 168, 0.2);
  }
  .price-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--teal);
    font-weight: 600;
    margin-bottom: 6px;
  }
  .price-amount {
    font-family: "Playfair Display", Georgia, serif;
    font-size: 56px;
    font-weight: 800;
    letter-spacing: -1.5px;
    line-height: 1;
  }
  .price-period {
    font-size: 15px;
    opacity: 0.85;
    margin-top: 6px;
  }
  .features {
    text-align: left;
    background: var(--grey-50);
    border-radius: 10px;
    padding: 18px 22px;
    margin-bottom: 22px;
    border: 1px solid var(--grey-200);
  }
  .feature {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 0;
    font-size: 15px;
    color: var(--grey-700);
  }
  .feature .check {
    color: var(--green);
    font-weight: 800;
    font-size: 16px;
  }

  /* ---------- Footer ---------- */
  .site-footer {
    border-top: 1px solid var(--grey-200);
    padding: 22px 24px 28px;
    text-align: center;
    background: #fff;
    margin-top: 40px;
  }
  .footer-links {
    color: var(--grey-500);
    font-size: 13px;
    line-height: 1.8;
  }
  .footer-links a {
    color: var(--grey-500);
    text-decoration: underline;
    margin: 0 4px;
  }
  .footer-links a:hover { color: var(--navy); }
  .footer-links .sep { margin: 0 4px; }

  /* ---------- Confetti ---------- */
  #confetti {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 50;
  }

  .screen { animation: fadeIn 0.35s ease; }

  /* ---------- Mobile ---------- */
  @media (max-width: 768px) {
    .site-header {
      grid-template-columns: auto auto;
      grid-template-areas:
        "logo phone"
        "progress progress";
      padding: 16px 16px 12px;
      gap: 14px;
    }
    .logo { grid-area: logo; }
    .phone { grid-area: phone; font-size: 14px; }
    .phone svg { width: 18px; height: 18px; }
    .header-progress { grid-area: progress; padding-top: 14px; }
    .logo svg { width: 28px; height: 28px; }
    .logo-text .top { font-size: 18px; }
    .logo-text .bottom { font-size: 9px; letter-spacing: 3px; }

    .main { padding: 22px 16px 32px; }
    .pretitle { font-size: 14px; }
    .question-title { font-size: 28px; margin-bottom: 26px; }

    .options { grid-template-columns: 1fr; gap: 12px; }
    .options.three, .options.five { grid-template-columns: repeat(3, 1fr); }
    .options.five { grid-template-columns: repeat(5, 1fr); }
    .option-btn { padding: 18px 12px; font-size: 15px; }
    .options.three .option-btn,
    .options.five .option-btn { padding: 16px 8px; font-size: 15px; }

    .btn-primary { min-width: 0; flex: 1; }
    .actions { flex-direction: row; }

    .call-expert { margin-top: 40px; flex-wrap: wrap; gap: 10px; font-size: 13px; }
    .call-expert .avatar { width: 44px; height: 44px; }
    .call-expert .avatar svg { width: 22px; height: 22px; }

    .result h1 { font-size: 28px; }
    .price-amount { font-size: 44px; }

    .footer-links { font-size: 12px; }
  }
</style>
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <a href="#" class="logo" aria-label="Home">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 11.5L12 4l9 7.5V20a1 1 0 01-1 1h-5v-6h-6v6H4a1 1 0 01-1-1v-8.5z"
              fill="#15254a" stroke="#15254a" stroke-width="0.6" stroke-linejoin="round"/>
      </svg>
      <span class="logo-text">
        <span class="top">HOME INSURANCE</span>
        <span class="bottom">RATES</span>
      </span>
    </a>

    <div class="header-progress">
      <div class="header-progress-track">
        <div class="header-progress-fill" id="progressFill" style="width:20%"></div>
        <div class="header-progress-bubble" id="progressBubble" style="left:20%">20%</div>
      </div>
    </div>

    <a href="tel:8776630285" class="phone">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M22 16.92V20a2 2 0 01-2.18 2 19.86 19.86 0 01-8.63-3.07 19.5 19.5 0 01-6-6A19.86 19.86 0 012.12 4.18 2 2 0 014.11 2h3.08a2 2 0 012 1.72c.13.96.36 1.91.7 2.81a2 2 0 01-.45 2.11L8.09 10a16 16 0 006 6l1.36-1.35a2 2 0 012.11-.45c.9.34 1.85.57 2.81.7a2 2 0 011.72 2.02z"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>(877) 663-0285</span>
    </a>
  </header>

  <!-- Main -->
  <main class="main">
    <div class="main-inner" id="card">
      <!-- Screens render here -->
    </div>

    <!-- Call expert widget -->
    <div class="call-expert" id="callExpert">
      <div class="avatar" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M22 16.92V20a2 2 0 01-2.18 2 19.86 19.86 0 01-8.63-3.07 19.5 19.5 0 01-6-6A19.86 19.86 0 012.12 4.18 2 2 0 014.11 2h3.08a2 2 0 012 1.72c.13.96.36 1.91.7 2.81a2 2 0 01-.45 2.11L8.09 10a16 16 0 006 6l1.36-1.35a2 2 0 012.11-.45c.9.34 1.85.57 2.81.7a2 2 0 011.72 2.02z"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="label">Call an expert</span>
      <a href="tel:8776630285" class="phone-link">(877) 663-0285</a>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="footer-links">
      <a href="#">Do Not Sell</a><span class="sep">&amp;</span>
      <a href="#">Privacy Policy</a><span class="sep">&amp;</span>
      <a href="#">Terms &amp; Conditions</a>
    </div>
  </footer>

  <canvas id="confetti"></canvas>

<script>
(() => {
  const TOTAL_QUESTIONS = 5;
  const state = { step: 0, answers: {} };

  const questions = [
    {
      key: 'zip',
      pretitle: "Compare & <strong>Save</strong> on Home Insurance Rates!",
      title: "What's your ZIP code?",
      type: 'input',
      inputType: 'tel',
      placeholder: '12345',
      maxLength: 5,
      validate: v => /^\d{5}$/.test(v),
    },
    {
      key: 'homeType',
      pretitle: "Compare & <strong>Save</strong> on Home Insurance Rates!",
      title: "Choose Your Home Type",
      type: 'options',
      layout: 'three',
      autoAdvance: true,
      options: [
        { value: 'house', label: 'House' },
        { value: 'condo', label: 'Condo' },
        { value: 'apartment', label: 'Apartment' },
      ],
    },
    {
      key: 'yearBuilt',
      pretitle: "Tell us about your home",
      title: "When Was Your Home Built?",
      type: 'input',
      inputType: 'tel',
      placeholder: 'e.g. 1998',
      maxLength: 4,
      validate: v => /^\d{4}$/.test(v) && +v >= 1800 && +v <= new Date().getFullYear(),
    },
    {
      key: 'sqft',
      pretitle: "Tell us about your home",
      title: "What's Your Home's Square Footage?",
      type: 'input',
      inputType: 'tel',
      placeholder: 'e.g. 1800',
      maxLength: 6,
      validate: v => /^\d{2,6}$/.test(v) && +v >= 100,
    },
    {
      key: 'bedrooms',
      pretitle: "Last question!",
      title: "How Many Bedrooms?",
      type: 'options',
      layout: 'five',
      autoAdvance: true,
      options: [
        { value: '1', label: '1' },
        { value: '2', label: '2' },
        { value: '3', label: '3' },
        { value: '4', label: '4' },
        { value: '5+', label: '5+' },
      ],
    },
  ];

  const card = document.getElementById('card');
  const progressFill = document.getElementById('progressFill');
  const progressBubble = document.getElementById('progressBubble');
  const callExpert = document.getElementById('callExpert');

  function setProgress(step) {
    const pct = step >= TOTAL_QUESTIONS ? 100 : Math.round(((step) / TOTAL_QUESTIONS) * 100);
    const display = Math.max(pct, 4);
    progressFill.style.width = display + '%';
    progressBubble.style.left = display + '%';
    progressBubble.textContent = pct + '%';
  }

  function render() {
    if (state.step >= TOTAL_QUESTIONS) {
      setProgress(TOTAL_QUESTIONS);
      callExpert.style.display = 'none';
      return renderLoading();
    }
    callExpert.style.display = '';
    setProgress(state.step);

    const q = questions[state.step];
    const answer = state.answers[q.key] || '';

    let body = '';
    if (q.type === 'input') {
      body = `
        <input
          class="field"
          id="answer"
          type="${q.inputType || 'text'}"
          inputmode="${q.inputType === 'tel' ? 'numeric' : 'text'}"
          placeholder="${q.placeholder || ''}"
          maxlength="${q.maxLength || 50}"
          value="${escapeHtml(answer)}"
          autocomplete="off"
        />`;
    } else {
      const layoutClass = q.layout || '';
      body = `<div class="options ${layoutClass}">${q.options.map(o => `
        <button class="option-btn ${answer === o.value ? 'selected' : ''}" data-value="${o.value}">
          ${o.label}
        </button>`).join('')}</div>`;
    }

    const showActions = q.type === 'input' || !q.autoAdvance;
    const actions = showActions ? `
      <div class="actions">
        ${state.step > 0 ? `<button class="btn btn-ghost" id="back">Back</button>` : ''}
        <button class="btn btn-primary" id="next" ${canAdvance(q, answer) ? '' : 'disabled'}>
          ${state.step === TOTAL_QUESTIONS - 1 ? 'See My Rate' : 'Continue'}
        </button>
      </div>` : (state.step > 0 ? `
      <div class="actions">
        <button class="btn btn-ghost" id="back">Back</button>
      </div>` : '');

    card.innerHTML = `
      <div class="screen">
        <p class="pretitle">${q.pretitle}</p>
        <h1 class="question-title">${escapeHtml(q.title)}</h1>
        ${body}
        ${actions}
      </div>`;

    bindEvents(q);
  }

  function canAdvance(q, value) {
    if (!value) return false;
    if (q.validate) return q.validate(value);
    return true;
  }

  function bindEvents(q) {
    const nextBtn = document.getElementById('next');
    const backBtn = document.getElementById('back');
    if (backBtn) backBtn.onclick = () => { state.step--; render(); };

    if (q.type === 'input') {
      const input = document.getElementById('answer');
      input.addEventListener('input', e => {
        state.answers[q.key] = e.target.value;
        if (nextBtn) nextBtn.disabled = !canAdvance(q, e.target.value);
      });
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter' && nextBtn && !nextBtn.disabled) advance();
      });
      if (window.matchMedia('(hover: hover)').matches) input.focus();
    } else {
      card.querySelectorAll('.option-btn').forEach(btn => {
        btn.onclick = () => {
          state.answers[q.key] = btn.dataset.value;
          card.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          if (nextBtn) nextBtn.disabled = false;
          if (q.autoAdvance) setTimeout(advance, 250);
        };
      });
    }

    if (nextBtn) nextBtn.onclick = advance;
  }

  function advance() {
    const q = questions[state.step];
    const v = state.answers[q.key];
    if (!canAdvance(q, v)) return;
    state.step++;
    render();
  }

  function renderLoading() {
    const messages = [
      'Checking your area...',
      'Comparing rates from top carriers...',
      'Almost done...',
    ];
    card.innerHTML = `
      <div class="screen loading">
        <div class="spinner"></div>
        <div class="loading-msg" id="loadingMsg">${messages[0]}</div>
      </div>`;
    const el = document.getElementById('loadingMsg');
    let i = 0;
    const interval = setInterval(() => {
      i++;
      if (i >= messages.length) return;
      el.style.opacity = '0';
      setTimeout(() => {
        el.textContent = messages[i];
        el.style.opacity = '1';
      }, 250);
    }, 850);

    setTimeout(() => {
      clearInterval(interval);
      renderResult();
    }, 2600);
  }

  function renderResult() {
    card.innerHTML = `
      <div class="screen result">
        <div class="result-emoji">🎉</div>
        <h1>You're pre-approved!</h1>
        <p class="result-sub">Based on your answers, here's your estimated rate:</p>
        <div class="price-card">
          <div class="price-label">Annual Premium</div>
          <div class="price-amount">$781.99</div>
          <div class="price-period">per year</div>
        </div>
        <div class="features">
          <div class="feature"><span class="check">✓</span> Dwelling coverage up to $300,000</div>
          <div class="feature"><span class="check">✓</span> Personal property protection</div>
          <div class="feature"><span class="check">✓</span> Liability coverage included</div>
          <div class="feature"><span class="check">✓</span> 24/7 claims support</div>
        </div>
        <div class="actions">
          <button class="btn btn-primary" id="continueBtn">Continue</button>
        </div>
      </div>`;

    document.getElementById('continueBtn').onclick = fireConfetti;
    fireConfetti();
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // Confetti
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  function sizeCanvas() {
    canvas.width = window.innerWidth * devicePixelRatio;
    canvas.height = window.innerHeight * devicePixelRatio;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }
  sizeCanvas();
  window.addEventListener('resize', sizeCanvas);

  const colors = ['#15254a', '#2db0a8', '#22c55e', '#1f3263', '#5fc7c1', '#ffffff'];
  let particles = [];
  let animating = false;

  function fireConfetti() {
    const W = window.innerWidth;
    const H = window.innerHeight;
    const count = 140;
    for (let i = 0; i < count; i++) {
      particles.push({
        x: W / 2 + (Math.random() - 0.5) * 60,
        y: H / 3,
        vx: (Math.random() - 0.5) * 14,
        vy: (Math.random() * -12) - 4,
        g: 0.32 + Math.random() * 0.15,
        size: 6 + Math.random() * 6,
        color: colors[Math.floor(Math.random() * colors.length)],
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 0.3,
        life: 0,
        maxLife: 120 + Math.random() * 60,
      });
    }
    if (!animating) {
      animating = true;
      requestAnimationFrame(tick);
    }
  }

  function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles = particles.filter(p => {
      p.vy += p.g;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      p.life++;
      const alpha = Math.max(0, 1 - p.life / p.maxLife);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
      ctx.restore();
      return p.life < p.maxLife && p.y < window.innerHeight + 40;
    });
    if (particles.length > 0) {
      requestAnimationFrame(tick);
    } else {
      animating = false;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }

  render();
})();
</script>
</body>
</html>
